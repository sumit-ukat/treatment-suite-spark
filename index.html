<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Keep every preview deployment out of search engines and archives. This build carries only
         fictional data, but the habit has to be in place before the one that does not. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <!-- Textless mark: legible at 16px and on any browser-tab background, light or dark. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Sora (headings) / Manrope (body) — part of the design foundation ported from the Lovable
         redesign; see src/app/styles.css for the --font-display / --font-sans tokens that use these. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />

    <!-- Group-level, since the landing view spans all ten centres. Deliberately names no client and
         no centre: a browser tab title is visible over someone's shoulder and in screen shares. -->
    <title>Treatment Operations — UKAT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
